name = "DeclarativeTomlPipeline"
description = "Multi-stage pipeline defined in pure TOML format"

[parameters]
environment = "staging"
batch_size = 500

[[tasks]]
id = "generate_payload"
type = "file"
description = "Writes a mock sensor data payload"
[tasks.params]
operation = "write"
path = "workspace_toml/sensor_batch.json"
content = '{"sensor_id": "temp-42", "temperatures": [21.5, 22.0, 21.8, 23.1, 22.4]}'

[[tasks]]
id = "calculate_summary"
type = "shell"
description = "Computes average temperature from generated file payload"
depends_on = ["generate_payload"]
[tasks.params]
from_upstream = "generate_payload"
command = 'python -c "import sys, json; path = sys.stdin.read().strip(); d = json.load(open(path)); avg = sum(d[\"temperatures\"]) / len(d[\"temperatures\"]); print(f\"Average Temperature: {avg:.2f} C\")"'

[[tasks]]
id = "archive_summary"
type = "file"
description = "Archives analysis output"
depends_on = ["calculate_summary"]
[tasks.params]
from_upstream = "calculate_summary"
operation = "write"
path = "workspace_toml/summary.log"
